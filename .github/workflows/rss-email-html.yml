name: RSS Email

on:
  push:
    branches:
      - main
    paths:
      - "rss/**/*.txt"
  schedule:
    # Backup cron in case no push happens during the window
    - cron: "*/30 0-2,6-8,12-14 * * *"
  workflow_dispatch:

concurrency:
  group: rss-email-notify
  cancel-in-progress: false

jobs:
  send-email:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Send combined RSS plain text email
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          MAIL_HOST: smtp.163.com
          MAIL_PORT: "465"
          MAIL_USER: "alex653@163.com"
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          RECEIVER: "alex@emalex666.dpdns.org"
        run: python notify_rss.py

      - name: Save notification state
        run: |
          if [ -f .rss-notify-state.json ] && [ -n "$(git status --porcelain -- .rss-notify-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .rss-notify-state.json
            git commit -m "chore: update rss notification state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
